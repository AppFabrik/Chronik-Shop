<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronik-Übersicht</title>
  
  <!-- PWA Manifest & Themes -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c3e50">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      background-color: #f4f6f8;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 24px;
    }
    #loading {
      text-align: center;
      color: #666;
      font-size: 16px;
      margin-top: 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-label {
      font-size: 13px;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .card-value {
      font-size: 22px;
      font-weight: bold;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <h1>Chronik-Übersicht</h1>
  <div id="loading">Daten werden geladen...</div>
  <div id="data-container" class="grid"></div>

  <script>
    // Neue Apps Script Web-App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbxHkp3RE5ZBwO8_yl9sVfkfRe6ytNmTTYmI8GLkOJ-L2QhqjgXDw5WscloixFdM8eG-Qg/exec";

    async function loadData() {
      const loadingEl = document.getElementById('loading');
      const containerEl = document.getElementById('data-container');

      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        loadingEl.style.display = 'none';

        if (!data || data.length === 0) {
          containerEl.innerHTML = "<p>Keine Daten gefunden.</p>";
          return;
        }

        // Rendert die 4 Werte als saubere Dashboard-Kacheln
        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-label">${item.label}</div>
            <div class="card-value">${item.value || '0'}</div>
          `;
          containerEl.appendChild(card);
        });

      } catch (error) {
        console.error("Fehler beim Laden:", error);
        loadingEl.innerText = "Fehler beim Laden der Daten.";
      }
    }

    loadData();

    // Service Worker registrieren
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker aktiv:', reg))
          .catch(err => console.error('Service Worker Fehler:', err));
      });
    }
  </script>
</body>
</html>
