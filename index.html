<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronik-Übersicht</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c3e50">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      background-color: #f4f6f8;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 24px;
    }
    #loading {
      text-align: center;
      color: #666;
      font-size: 16px;
      margin-top: 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-label {
      font-size: 13px;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .card-value {
      font-size: 22px;
      font-weight: bold;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <h1>Chronik-Übersicht</h1>
  <div id="loading">Daten werden geladen...</div>
  <div id="data-container" class="grid"></div>

  <script>
    // Aktuelle Apps Script Web-App URL (mit JSONP)
    const API_URL = "https://script.google.com/macros/s/AKfycbwftqz-44toEmSzKLhTEAaZpcmFq7He9N1ij0JEAiV187NVuGwiakaLykxPNzcUk29Xhg/exec";

    // Callback-Funktion für JSONP
    window.handleData = function(data) {
      const loadingEl = document.getElementById('loading');
      const containerEl = document.getElementById('data-container');

      loadingEl.style.display = 'none';
      containerEl.innerHTML = '';

      if (!data || data.length === 0) {
        containerEl.innerHTML = "<p>Keine Daten in der Tabelle gefunden.</p>";
        return;
      }

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-label">${item.label || 'Wert'}</div>
          <div class="card-value">${item.value !== undefined ? item.value : '0'}</div>
        `;
        containerEl.appendChild(card);
      });
    };

    function loadDataJSONP() {
      const script = document.createElement('script');
      script.src = API_URL + "?callback=handleData";
      script.onerror = function() {
        const loadingEl = document.getElementById('loading');
        loadingEl.innerText = "Fehler beim Laden der Daten (Netzwerkfehler).";
        loadingEl.style.color = "#dc2626";
      };
      document.body.appendChild(script);
    }

    loadDataJSONP();

    // Service Worker registrieren
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker aktiv:', reg))
          .catch(err => console.error('Service Worker Fehler:', err));
      });
    }
  </script>
</body>
</html>
